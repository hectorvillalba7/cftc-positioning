<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posicionamiento CFTC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF1F4; --panel: #FFFFFF; --ink: #16202E; --muted: #5B6878;
  --line: #E3E8ED; --rule: #B9C3CE; --head: #E6EBF0; --hover: #F5F7F9;
  --label: #0070C0; --record: #6A35D8; --record-soft: #EFE8FD;
  --grid: #BCC6D0; --sub: #7C8998; --grp: #2F3B4A; --mh: .85; --ml: .30; --mt: .11;
  --g1: #DDF1E3; --g2: #FBE0E1; --g3: #DCEBFA; --g4: #FCEFD2;
  --b-tl: rgba(0,138,239,.40); --b-s: rgba(255,85,90,.42);
  --b-pl: rgba(99,195,132,.55); --b-t: rgba(255,182,40,.55);
  --scale: 99,190,123;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151C; --panel: #151D26; --ink: #E4EAF0; --muted: #8E9BAA;
    --line: #232E3A; --rule: #3B4958; --head: #1C2631; --hover: #1A232D;
    --label: #2F8FD8; --record: #B49BFF; --record-soft: #2A2244;
    --grid: #34414F; --sub: #5F6F80; --grp: #A9B6C4; --mh: .62; --ml: .22; --mt: .13;
    --g1: #1F3A2B; --g2: #44262A; --g3: #1D3349; --g4: #40351C;
    --b-tl: rgba(0,138,239,.50); --b-s: rgba(255,85,90,.48);
    --b-pl: rgba(99,195,132,.48); --b-t: rgba(255,182,40,.45);
    --scale: 78,170,110;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151C; --panel: #151D26; --ink: #E4EAF0; --muted: #8E9BAA;
  --line: #232E3A; --rule: #3B4958; --head: #1C2631; --hover: #1A232D;
  --label: #2F8FD8; --record: #B49BFF; --record-soft: #2A2244;
  --grid: #34414F; --sub: #5F6F80; --grp: #A9B6C4; --mh: .62; --ml: .22; --mt: .13;
  --g1: #1F3A2B; --g2: #44262A; --g3: #1D3349; --g4: #40351C;
  --b-tl: rgba(0,138,239,.50); --b-s: rgba(255,85,90,.48);
  --b-pl: rgba(99,195,132,.48); --b-t: rgba(255,182,40,.45);
  --scale: 78,170,110;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column;
  background: var(--bg); color: var(--ink);
  font: 14px/1.4 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--label); outline-offset: 1px; }

/* Cabecera */
.top { padding: 14px 20px 0; }
.top-row { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.reports { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.reports button { border: 0; background: transparent; padding: 4px 12px; }
.reports button + button { border-left: 1px solid var(--rule); }
.reports button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.asof { margin-left: auto; color: var(--muted); }
.assets { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; border-bottom: 1px solid var(--rule); }
.assets button {
  border: 0; background: transparent; padding: 7px 12px 8px; white-space: nowrap;
  border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--muted); font-weight: 500;
}
.assets button:hover { color: var(--ink); }
.assets button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--record); margin-left: 6px; vertical-align: 1px; }

/* Último reporte */
.week { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 10px 20px 0; }
.week .lead { font-weight: 500; }
.week .none { color: var(--muted); }
.chip {
  border: 1px solid var(--record); background: var(--record-soft); border-radius: 999px;
  padding: 2px 10px; font-size: 13px;
}
.chip b { font-weight: 600; }
.chip .n { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--record); margin-left: 4px; }
.note { margin: 10px 20px 0; padding: 8px 12px; border-left: 3px solid var(--b-t); background: var(--panel); color: var(--muted); max-width: 110ch; }

/* Barra de herramientas */
.tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 12px 20px 8px; }
.tools h2 { margin: 0; font-size: 16px; font-weight: 600; }
.tools .inv { color: var(--muted); font-size: 13px; }
.tools .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tools select, .tools .btn {
  border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 4px 10px; height: 30px;
}
.tools .btn[aria-expanded="true"] { background: var(--record); border-color: var(--record); color: var(--panel); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12.5px; padding: 0 20px 8px; }
.legend i { display: inline-block; width: 22px; height: 10px; vertical-align: -1px; margin-right: 5px; border-radius: 1px; }
.legend .rec { background: transparent; box-shadow: inset 0 0 0 2px var(--record); }
.legend .pill { border-radius: 2px; background: linear-gradient(90deg, rgba(var(--rgb), var(--ml)), rgba(var(--rgb), var(--mh))); }

/* Tabla */
main { flex: 1 0 340px; min-height: 340px; display: flex; gap: 12px; padding: 0 20px 16px; }
.wrap {
  flex: 1; min-width: 0; overflow: auto; position: relative;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
}
table {
  border-collapse: separate; border-spacing: 0; white-space: nowrap;
  font: 13px/1 "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
th, td { height: 24px; padding: 0 7px; text-align: right; border-bottom: 1px solid var(--line); border-left: 1px solid var(--grid); }
thead { position: sticky; top: 0; z-index: 3; }
thead th { background: var(--head); font-weight: 500; border-bottom-color: var(--rule); }
thead .gname { text-align: left; font-weight: 600; font-size: 13.5px; height: 28px; }
thead .gname.g1 { background-color: var(--g1); } thead .gname.g2 { background-color: var(--g2); }
thead .gname.g3 { background-color: var(--g3); } thead .gname.g4 { background-color: var(--g4); }
thead .sub { text-align: left; color: var(--muted); font-size: 12px; height: 20px; border-bottom-color: var(--line); }
thead .tth { line-height: 1.15; vertical-align: bottom; padding-bottom: 5px; }
.d { position: sticky; left: 0; z-index: 2; text-align: left; background: var(--panel); min-width: 82px; border-left: 0; border-right: 2px solid var(--sub); }
thead .d { background: var(--head); z-index: 4; border-left: 0; vertical-align: bottom; padding-bottom: 5px; }
.d + th, .d + td { border-left: 0; }
.ss { border-left: 2px solid var(--sub); }
.gs { border-left: 3px solid var(--grp); }
.mm th { background-color: var(--panel); font-weight: 600; }
.mm .lab { background-color: var(--label); color: #fff; }
.mm:last-child th { border-bottom: 2px solid var(--rule); }
tbody tr:hover td { background-color: var(--hover); }
.b {
  background-image: linear-gradient(90deg, var(--bar) var(--p, 0%), transparent var(--p, 0%));
  background-repeat: no-repeat; background-size: calc(100% - 6px) 16px; background-position: 3px 50%;
}
.c-tl { --bar: var(--b-tl); } .c-s { --bar: var(--b-s); } .c-t { --bar: var(--b-t); }
.s {
  background-image: linear-gradient(rgba(var(--scale), var(--a, 0)), rgba(var(--scale), var(--a, 0)));
  box-shadow: inset 0 0 0 2px var(--panel);
}
/* Posiciones: barra con degradado sobre un carril que marca hasta dónde llega el máximo. */
.m { position: relative; z-index: 0; }
.m::before, .m::after { content: ""; position: absolute; z-index: -1; left: 4px; top: 4px; bottom: 4px; border-radius: 2px; }
.m::before { right: 4px; background: rgba(var(--rgb), var(--mt)); }
.m::after {
  width: calc((100% - 8px) * var(--f, 0)); min-width: 3px;
  background: linear-gradient(90deg, rgba(var(--rgb), var(--ml)), rgba(var(--rgb), var(--mh)));
}
.c-pl { --rgb: 38,166,91; } .c-ps { --rgb: 236,64,74; } .c-pt { --rgb: 240,160,10; }
td.ev, td.s.ev { box-shadow: inset 0 0 0 2px var(--record); font-weight: 600; }
tr.yr td { border-top: 2px solid var(--rule); }
tr.gap td { height: 22px; text-align: left; color: var(--muted); font-style: italic; background: var(--bg); }
tbody tr { scroll-margin-top: var(--thead-h, 150px); }
td.flash { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: inset 0 0 0 3px var(--record), 0 0 0 4px var(--record-soft); } }
@media (prefers-reduced-motion: reduce) { td.flash { animation: none; } }

/* Panel de máximos superados */
aside {
  width: 330px; flex: none; display: flex; flex-direction: column; min-height: 0;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
}
aside[hidden] { display: none; }
aside header { padding: 10px 12px; border-bottom: 1px solid var(--line); }
aside h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
aside p { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
aside select { width: 100%; border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 4px 8px; }
aside ol { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
aside li button {
  display: grid; grid-template-columns: 70px 1fr auto; gap: 0 8px; width: 100%; text-align: left;
  border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 6px 12px; font-size: 13px;
}
aside li button:hover { background: var(--hover); }
aside .when { color: var(--muted); font-variant-numeric: tabular-nums; }
aside .val { font-weight: 600; font-variant-numeric: tabular-nums; }
aside .prev { grid-column: 2 / 4; color: var(--muted); font-size: 12px; }
aside .none { padding: 12px; color: var(--muted); }

.empty { margin: auto; max-width: 52ch; padding: 24px; text-align: center; }
.empty h2 { font-size: 18px; margin: 0 0 8px; }
.empty p { color: var(--muted); margin: 0; }

@media (max-width: 820px) {
  .top, .week, .tools, .legend { padding-left: 12px; padding-right: 12px; }
  main { flex-direction: column-reverse; padding: 0 12px 12px; }
  html, body { height: auto; }
  body { display: block; }
  .wrap { max-height: 82vh; }
  aside { width: auto; max-height: 45vh; }
  .asof { margin-left: 0; width: 100%; }
  .chip { text-align: left; border-radius: 12px; }
  .legend span:last-child { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>Posicionamiento CFTC</h1>
    <div class="reports" id="reports" role="group" aria-label="Reporte"></div>
    <div class="asof" id="asof"></div>
  </div>
  <nav class="assets" id="assets" role="tablist" aria-label="Activo"></nav>
</header>
<div class="note" id="note" hidden></div>
<section class="week" id="week" aria-label="Máximos del último reporte"></section>
<div class="tools">
  <h2 id="asset-name"></h2>
  <span class="inv" id="inv"></span>
  <div class="right">
    <label for="year" class="inv">Ir a</label>
    <select id="year" aria-label="Ir a un año"></select>
    <button class="btn" id="ev-toggle" aria-expanded="false" aria-controls="events">Máximos superados</button>
  </div>
</div>
<div class="legend" aria-hidden="true">
  <span><i style="background:var(--b-tl)"></i>traders long</span>
  <span><i style="background:var(--b-s)"></i>traders short</span>
  <span><i class="pill c-pl"></i>posiciones long</span>
  <span><i class="pill c-ps"></i>posiciones short</span>
  <span><i style="background:var(--b-t)"></i><i class="pill c-pt"></i>totales</span>
  <span><i style="background:rgba(var(--scale),.85)"></i>porcentajes</span>
  <span><i class="rec"></i>supera el máximo histórico previo</span>
  <span>Barra llena o verde más intenso = máximo histórico de la columna (fila Máx).</span>
</div>
<main>
  <div class="wrap" id="wrap" tabindex="0" aria-label="Tabla histórica"><table id="table"></table></div>
  <aside id="events" hidden>
    <header>
      <h3>Máximos superados</h3>
      <p id="ev-sub"></p>
      <select id="ev-filter" aria-label="Filtrar por columna"></select>
    </header>
    <ol id="ev-list"></ol>
  </aside>
</main>

<script>
(function () {
  const INLINE = window.__COT__ || null;
  const $ = (s) => document.querySelector(s);
  const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const DAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const GROUP_FIELDS = ['tl', 'ts', 'ptl', 'pts', 'pl', 'ps', 'pt', 'pol', 'pos'];
  const FIELD = {
    tt:  { cls: 'b c-t',  name: 'Total de traders' },
    tl:  { h: 'Long',       cls: 'b c-tl', name: 'traders long' },
    ts:  { h: 'Short',      cls: 'b c-s',  name: 'traders short' },
    ptl: { h: '% Long',     cls: 's', pct: true },
    pts: { h: '% Short',    cls: 's', pct: true },
    pl:  { h: 'Long',       cls: 'm c-pl', name: 'posiciones long' },
    ps:  { h: 'Short',      cls: 'm c-ps', name: 'posiciones short' },
    pt:  { h: 'Total',      cls: 'm c-pt', name: 'posiciones totales' },
    pol: { h: '% Long',     cls: 's', pct: true },
    pos: { h: '% Short',    cls: 's', pct: true },
  };
  const nf0 = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fmtDate = (iso) => { const p = iso.split('-'); return p[2] + '-' + MONTHS[+p[1] - 1] + '-' + p[0].slice(2); };
  const fieldOf = (col) => col.split('.').pop();
  const fmt = (v, f) => (v == null ? '' : FIELD[f].pct ? nf1.format(v) : nf0.format(v));
  const groupStart = (i) => i >= 1 && (i - 1) % GROUP_FIELDS.length === 0;
  const subStart = (i) => i >= 1 && (i - 1) % GROUP_FIELDS.length === 4;
  // p = posición del dato entre el mínimo (0) y el máximo (1) histórico de su columna.
  const styleFor = (meta, p) => (meta.pct ? '--a:' + (0.05 + 0.8 * p).toFixed(2)
    : meta.cls[0] === 'm' ? '--f:' + (0.04 + 0.96 * p).toFixed(3)
    : '--p:' + Math.round(3 + 97 * p) + '%');
  // Color de la etiqueta de cada grupo; los grupos sin color propio lo toman por orden.
  const GROUP_TINT = { asset_mgr: 'g1', dealer: 'g2', lev_money: 'g3' };
  const sepClass = (i) => (groupStart(i) ? ' gs' : subStart(i) ? ' ss' : '');
  const state = { index: null, report: null, asset: null, data: null, labels: {} };

  async function getJSON(path) {
    if (INLINE) {
      if (!(path in INLINE.files)) throw new Error('missing ' + path);
      return INLINE.files[path];
    }
    const res = await fetch('data/' + path, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }

  function colLabel(col) {
    if (col.indexOf('.') < 0) return FIELD[col].name;
    const parts = col.split('.');
    return state.labels[parts[0]] + ', ' + FIELD[parts[1]].name;
  }

  function showEmpty() {
    document.body.innerHTML =
      '<div class="empty"><h2>Todavía no hay datos</h2>' +
      '<p>En tu repositorio de GitHub, abre la pestaña Actions y ejecuta «Actualizar datos CFTC». ' +
      'En un par de minutos esta página mostrará el histórico completo.</p></div>';
  }

  async function init() {
    try { state.index = await getJSON('index.json'); } catch (e) { showEmpty(); return; }
    if (INLINE && INLINE.note) { $('#note').hidden = false; $('#note').textContent = INLINE.note; }
    let rk, ak;
    try { [rk, ak] = location.hash.slice(1).split('/'); } catch (e) { /* sin acceso al hash */ }
    go(rk, ak);
  }

  async function go(reportKey, assetId, focus) {
    const idx = state.index;
    const rep = idx.reports.find((r) => r.key === reportKey) || idx.reports[0];
    const asset = rep.assets.find((a) => a.id === assetId) || rep.assets[0];
    state.report = rep; state.asset = asset;
    state.labels = {}; rep.groups.forEach((g) => { state.labels[g.key] = g.label; });
    try { history.replaceState(null, '', '#' + rep.key + '/' + asset.id); } catch (e) { /* entorno sin historial */ }
    renderChrome();
    try {
      state.data = await getJSON(rep.key + '/' + asset.id + '.json');
    } catch (e) {
      $('#table').innerHTML = '<tbody><tr><td class="d">No se han podido cargar los datos de ' + asset.name + '.</td></tr></tbody>';
      return;
    }
    renderTable();
    renderEvents();
    if (focus) focusCell(focus.d, focus.c);
  }

  function renderChrome() {
    const rep = state.report, asset = state.asset;
    $('#reports').innerHTML = state.index.reports.map((r) =>
      '<button data-r="' + r.key + '" aria-pressed="' + (r.key === rep.key) + '" title="' + r.subtitle + '">' + r.title + '</button>').join('');
    const day = DAYS[new Date(rep.latest + 'T00:00:00Z').getUTCDay()];
    $('#asof').textContent = 'Datos al ' + day + ' ' + fmtDate(rep.latest) +
      (rep.variant === 'combined' ? ' (futuros y opciones)' : ' (solo futuros)');
    $('#assets').innerHTML = rep.assets.map((a) => {
      const n = a.latest_events.length;
      return '<button role="tab" data-a="' + a.id + '" aria-selected="' + (a.id === asset.id) + '">' + a.name +
        (n ? '<span class="dot" title="' + n + (n > 1 ? ' máximos nuevos' : ' máximo nuevo') + ' en el último reporte"></span>' : '') + '</button>';
    }).join('');
    const items = [];
    rep.assets.forEach((a) => a.latest_events.forEach((e) => items.push([a, e])));
    $('#week').innerHTML = '<span class="lead">Último reporte:</span>' + (items.length
      ? items.map(([a, e]) => '<button class="chip" data-a="' + a.id + '" data-d="' + e.d + '" data-c="' + e.c + '"><b>' + a.name + '</b> ' +
          colLabel(e.c) + '<span class="n">' + fmt(e.v, fieldOf(e.c)) + '</span></button>').join('')
      : '<span class="none">ninguna columna supera su máximo histórico.</span>');
    $('#asset-name').textContent = asset.name;
    $('#inv').textContent = asset.inverted ? 'Largos y cortos cruzados: se lee como el par, no como el futuro.' : '';
  }

  function renderTable() {
    const data = state.data, cols = data.columns, groups = state.report.groups;
    let h = '<thead><tr><th class="d" rowspan="3">Fecha</th><th class="tth" rowspan="3">Total<br>traders</th>';
    groups.forEach((g, i) => { h += '<th class="gs gname ' + (GROUP_TINT[g.key] || 'g' + (i % 4 + 1)) + '" colspan="9">' + g.label + '</th>'; });
    h += '</tr><tr>';
    groups.forEach(() => { h += '<th class="gs sub" colspan="4">Traders, % sobre el total</th><th class="sub ss" colspan="5">Contratos, % sobre open interest</th>'; });
    h += '</tr><tr>';
    groups.forEach(() => GROUP_FIELDS.forEach((f, i) => { h += '<th class="' + (i === 0 ? 'gs' : i === 4 ? 'ss' : '') + '">' + FIELD[f].h + '</th>'; }));
    h += '</tr>';
    ['min', 'max'].forEach((k) => {
      h += '<tr class="mm"><th class="d lab">' + (k === 'min' ? 'Mín' : 'Máx') + '</th>';
      cols.forEach((c, i) => {
        const s = data.stats[c], meta = FIELD[fieldOf(c)];
        if (!s) { h += '<th class="' + sepClass(i).trim() + '"></th>'; return; }
        const p = k === 'max' || s.max === s.min ? 1 : 0;
        h += '<th class="' + meta.cls + sepClass(i) + '" style="' + styleFor(meta, p) + '" title="' + fmtDate(s[k + '_date']) + '">' +
          fmt(s[k], fieldOf(c)) + '</th>';
      });
      h += '</tr>';
    });
    h += '</thead><tbody>';

    const ev = new Map();
    data.events.forEach((e) => ev.set(e.d + '|' + e.c, e));
    const years = [];
    data.dates.forEach((d, ri) => {
      const y = d.slice(0, 4), firstOfYear = years[years.length - 1] !== y;
      if (firstOfYear) years.push(y);
      h += '<tr id="r-' + d + '"' + (firstOfYear ? ' data-y="' + y + '"' + (ri ? ' class="yr"' : '') : '') + '><td class="d">' + fmtDate(d) + '</td>';
      const row = data.rows[ri];
      cols.forEach((c, i) => {
        const v = row[i], f = fieldOf(c), meta = FIELD[f], s = data.stats[c], gs = sepClass(i);
        if (v == null) { h += '<td class="' + gs.trim() + '"></td>'; return; }
        const p = s && s.max > s.min ? (v - s.min) / (s.max - s.min) : 1;
        const style = styleFor(meta, p);
        const e = ev.get(d + '|' + c);
        h += '<td class="' + meta.cls + gs + (e ? ' ev' : '') + '" style="' + style + '"' +
          (e ? ' title="Supera el máximo histórico. Anterior: ' + fmt(e.p, f) + ' (' + fmtDate(e.pd) + ')"' : '') + '>' + fmt(v, f) + '</td>';
      });
      h += '</tr>';
      const older = data.dates[ri + 1];
      if (older) {
        const gap = (Date.parse(d) - Date.parse(older)) / 864e5;
        if (gap > 10) {
          const n = Math.round(gap / 7) - 1;
          h += '<tr class="gap"><td class="d"></td><td colspan="' + cols.length + '">Sin reporte entre el ' + fmtDate(older) +
            ' y el ' + fmtDate(d) + ' (' + n + (n === 1 ? ' semana' : ' semanas') + ' sin datos)</td></tr>';
        }
      }
    });
    $('#table').innerHTML = h + '</tbody>';
    const wrap = $('#wrap');
    wrap.scrollTop = 0;
    wrap.style.setProperty('--thead-h', $('#table thead').offsetHeight + 'px');
    $('#year').innerHTML = years.map((y) => '<option>' + y + '</option>').join('');
  }

  function renderEvents() {
    const data = state.data, cols = data.columns;
    const used = Array.from(new Set(data.events.map((e) => e.c))).sort((a, b) => cols.indexOf(a) - cols.indexOf(b));
    $('#ev-filter').innerHTML = '<option value="">Todas las columnas</option>' +
      used.map((c) => '<option value="' + c + '">' + colLabel(c) + '</option>').join('');
    $('#ev-toggle').textContent = 'Máximos superados (' + data.events.length + ')';
    $('#ev-sub').textContent = 'Semanas en las que una columna de traders o de posiciones superó su máximo previo, desde ' +
      fmtDate(state.report.warmup_until || state.index.warmup_until) + '.';
    drawEvents();
  }

  function drawEvents() {
    const f = $('#ev-filter').value;
    const list = state.data.events.filter((e) => !f || e.c === f);
    $('#ev-list').innerHTML = list.length
      ? list.map((e) => '<li><button data-d="' + e.d + '" data-c="' + e.c + '"><span class="when">' + fmtDate(e.d) + '</span><span>' +
          colLabel(e.c) + '</span><span class="val">' + fmt(e.v, fieldOf(e.c)) + '</span><span class="prev">antes ' +
          fmt(e.p, fieldOf(e.c)) + ' (' + fmtDate(e.pd) + ')</span></button></li>').join('')
      : '<li class="none">Ninguna superación registrada todavía en este activo.</li>';
  }

  function scrollToRow(row) {
    const wrap = $('#wrap');
    wrap.scrollTop = row.offsetTop - $('#table thead').offsetHeight - 24;
  }

  function focusCell(d, c) {
    const row = document.getElementById('r-' + d);
    if (!row) return;
    scrollToRow(row);
    const cell = row.children[state.data.columns.indexOf(c) + 1];
    if (!cell) return;
    const wrap = $('#wrap');
    wrap.scrollLeft = Math.max(0, cell.offsetLeft - wrap.clientWidth / 2);
    cell.classList.remove('flash'); void cell.offsetWidth; cell.classList.add('flash');
  }

  $('#reports').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.r, state.asset.id); });
  $('#assets').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) go(state.report.key, b.dataset.a); });
  $('#week').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const focus = { d: b.dataset.d, c: b.dataset.c };
    if (b.dataset.a === state.asset.id) focusCell(focus.d, focus.c); else go(state.report.key, b.dataset.a, focus);
  });
  $('#year').addEventListener('change', (e) => {
    const row = $('#table tbody tr[data-y="' + e.target.value + '"]'); if (row) scrollToRow(row);
  });
  $('#ev-toggle').addEventListener('click', (e) => {
    const open = $('#events').hidden;
    $('#events').hidden = !open;
    e.currentTarget.setAttribute('aria-expanded', String(open));
  });
  $('#ev-filter').addEventListener('change', drawEvents);
  $('#ev-list').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) focusCell(b.dataset.d, b.dataset.c); });

  init();
})();
</script>
</body>
</html>
