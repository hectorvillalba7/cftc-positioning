name: Actualizar datos CFTC

on:
  schedule:
    # La CFTC publica los viernes a las 15:30 de Nueva York (19:30 o 20:30 UTC).
    # Se comprueba todos los días, varias veces: así también se recoge el
    # reporte cuando sale en lunes por festivo o con retraso. Si no hay
    # reporte nuevo, la ejecución termina en segundos sin tocar nada.
    - cron: "50 19,20,23 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Enviar un correo de prueba con el último reporte"
        type: boolean
        default: false
      force:
        description: "Recalcular todo aunque no haya reporte nuevo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Descargar y calcular
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: >
          python update.py
          ${{ inputs.test_email && '--test-email' || '' }}
          ${{ inputs.force && '--force' || '' }}
      - name: Guardar los datos en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Datos CFTC actualizados"
          git push
